name: Banco reproduzível

# Etapa 1 (19/10/2026), revisto na etapa 2. Faz duas conferências, sem alterar a produção:
#   1. Reconstrói num Postgres 17 vazio só as migrations que a produção já tem e compara a
#      "impressão digital" do schema com a da produção. Diferença = alguém mexeu no banco sem
#      migration (pelo painel do Supabase, por exemplo).
#   2. Aplica por cima as migrations novas, que ainda não foram publicadas, para provar que
#      elas rodam. É o mesmo script que depois as aplica no banco de teste e na produção.
#
# Roda toda segunda de manhã, à mão (Actions > Banco reproduzível > Run workflow) e como
# primeiro passo dos workflows "Publicar no teste" e "Publicar em produção".
# Segredo usado: SUPABASE_DB_URL (o mesmo do backup), sempre em modo somente leitura.

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/banco-reproduzivel.yml'

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PORTA: '55432'
      PSQL: /usr/lib/postgresql/17/bin/psql

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar Postgres 17 e pg_cron
        shell: bash
        run: bash supabase/pipeline/instalar_postgres.sh

      - name: Ler a produção (somente leitura)
        shell: bash
        run: |
          set -euo pipefail
          source supabase/pipeline/conexao.sh
          url="$(url_producao)"
          "$PSQL" "$url" -X -q -At -v ON_ERROR_STOP=1 -c 'set default_transaction_read_only = on' \
            -f supabase/reconstrucao/impressao_digital.sql > fp_producao.json
          "$PSQL" "$url" -X -q -At -v ON_ERROR_STOP=1 -c 'set default_transaction_read_only = on' \
            -c 'select version from supabase_migrations.schema_migrations order by 1' > versoes_producao.txt
          test -s fp_producao.json
          echo "Produção: $(wc -l < versoes_producao.txt) migrations no histórico."

      - name: Reconstruir como a produção está
        shell: bash
        run: |
          set -euo pipefail
          bash supabase/reconstrucao/reconstruir.sh "$PORTA" versoes_producao.txt
          "$PSQL" -h 127.0.0.1 -p "$PORTA" -U postgres -X -q -At -v ON_ERROR_STOP=1 \
            -f supabase/reconstrucao/impressao_digital.sql > fp_reconstruido.json

      - name: Comparar com a produção
        shell: bash
        run: |
          python3 supabase/reconstrucao/comparar_impressao.py fp_producao.json fp_reconstruido.json \
            --migrations supabase/migrations --versoes-producao versoes_producao.txt

      - name: Migrations novas rodam no banco reconstruído
        shell: bash
        run: |
          set -euo pipefail
          bash supabase/pipeline/aplicar_migrations.sh \
            --url "postgresql://postgres@127.0.0.1:${PORTA}/postgres" --autor reconstrucao

      - name: Guardar as impressões digitais (se falhar)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: impressoes-digitais
          path: |
            fp_producao.json
            fp_reconstruido.json
            versoes_producao.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Log do Postgres local (se falhar)
        if: failure()
        shell: bash
        run: |
          d="$(cat /tmp/barberium-pg-datadir 2>/dev/null || true)"
          if [ -n "$d" ]; then sudo tail -n 80 "$d/server.log" || true; fi
