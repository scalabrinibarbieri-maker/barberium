name: Deploy Barberium to Cloudflare Pages

on:
  push:
    branches:
      - main
    # Etapa 1: o envio de um pacote-*.zip não publica nada sozinho. O workflow
    # "Aplicar pacote" descompacta, faz o commit e dispara este deploy depois.
    paths-ignore:
      - 'pacote-*.zip'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, na ordem: um deploy antigo nunca termina depois de um novo.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/
          cp styles.css dist/
          cp desktop-v12.15.css dist/
          cp membership.css dist/
          cp site.webmanifest dist/
          cp sw.js dist/
          cp barberium.svg dist/
          cp ./*.js dist/
          cp -R assets dist/
          # Etapa 0 (19/10/2026): a Área da Equipe antiga (v11.2) que ficava em assets/
          # não pode ser publicada. assets/ é só para imagens.
          rm -f dist/assets/index.html dist/assets/team.js dist/assets/finance-reports.js
          if find dist/assets -type f \( -name '*.html' -o -name '*.js' \) | grep -q .; then
            echo "assets/ não pode conter HTML ou JS publicado:"
            find dist/assets -type f \( -name '*.html' -o -name '*.js' \)
            exit 1
          fi
          cp -R equipe dist/

      - name: Deploy production
        shell: bash
        env:
          # Etapa 1: a mensagem do commit entra por variável, nunca colada direto no script.
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual deploy' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name=barberium \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${COMMIT_MSG%%$'\n'*}"
