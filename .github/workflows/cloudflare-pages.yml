name: Deploy Barberium to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/
          cp styles.css dist/
          cp desktop-v12.15.css dist/
          cp app.js dist/
          cp push.js dist/
          cp membership.css dist/
          cp membership.js dist/
          cp barberium-client-v12.24.js dist/
          cp site.webmanifest dist/
          cp sw.js dist/
          cp barberium.svg dist/
          cp -R assets dist/
          cp -R equipe dist/

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist             --project-name=barberium             --branch=main             --commit-hash="${GITHUB_SHA}"             --commit-message="${{ github.event.head_commit.message || 'Manual deploy' }}"
